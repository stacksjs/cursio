name: Publish cursio

# Publishes packages/cursio to npm when a tag like `cursio-v0.1.1` is pushed.
# There is no token: npm trusts this workflow in this repository (trusted
# publishing, set on the package's npm page), and the tag must match the
# version in packages/cursio/package.json.

on:
  push:
    tags:
      - 'cursio-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use a current npm
        run: npm install -g npm@latest

      - name: Check the tag matches the package version
        working-directory: packages/cursio
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "cursio-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

      - name: Publish
        working-directory: packages/cursio
        run: npm publish --access public
