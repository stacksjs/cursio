name: Release

on:
  push:
    tags:
      - 'v*'

# `id-token` is what lets npm trust this workflow: the two packages are
# published with no token (trusted publishing, set on each package's npm page
# for this repository and this file).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # The changelog is generated from commits since the previous tag, so
          # the full history has to be present.
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@124b91b915f302a4a7cba19700045ee56cd4b9dc # v0.11.206
        with:
          install: 'false'

      - name: Use Cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # `bun run release:patch` bumps the app and both packages to one version
      # and pushes the tag that starts this run. The academy package goes
      # first: `cursio` depends on it.
      - name: Publish @cursio/academy
        working-directory: packages/academy
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish cursio
        working-directory: packages/cursio
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
